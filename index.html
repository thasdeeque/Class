<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thick Gliding Navigation</title>
    <style>
        :root {
            /* Animation timing variables */
            --trans-dur: 0.55s; 
            /* Beautiful smooth overshoot (spring-like) easing */
            --trans-ease: cubic-bezier(0.34, 1.3, 0.64, 1);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #F4F4F8; /* Light background */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        /* Outer pill container - Thicker, larger, and slightly lower */
        .bottom-nav {
            position: fixed;
            bottom: 16px; /* Moved a tiny bit closer to the bottom */
            display: flex;
            align-items: center;
            background-color: #1A1A1C;
            
            /* Precise sizing locks the container's shape */
            width: 358px; 
            height: 72px; /* Increased thickness */
            box-sizing: border-box;
            
            padding: 6px;
            gap: 8px; /* Slightly wider gaps between items */
            border-radius: 40px; 
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.15);
            -webkit-tap-highlight-color: transparent; 
        }

        /* Utility class used by JS to measure without triggering animations */
        .bottom-nav.no-transition * {
            transition: none !important;
        }

        /* The white gliding background */
        .glider {
            position: absolute;
            top: 6px;
            left: 0;
            height: 60px; /* Scaled up to match thicker nav */
            background-color: #F4F4F8;
            border-radius: 30px;
            z-index: 0;
            transition: transform var(--trans-dur) var(--trans-ease), 
                        width var(--trans-dur) var(--trans-ease);
        }

        /* Individual navigation items */
        .nav-item {
            position: relative;
            z-index: 1; /* Keeps items above the glider */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 60px; /* Thicker touch area */
            border-radius: 30px;
            text-decoration: none;
            color: #71717A; /* Inactive gray */
            cursor: pointer;
            
            /* Inactive state width */
            width: 60px; 
            flex-shrink: 0;
            
            transition: width var(--trans-dur) var(--trans-ease),
                        color var(--trans-dur) var(--trans-ease);
        }

        /* Active state - Pill is shorter/snugger than the previous version */
        .nav-item.active {
            width: 142px; /* Reduced from 156px for a tighter fit */
            color: #1A1A1C;
        }

        /* SVG Icons */
        .nav-item svg {
            width: 24px; /* Scaled up for the thicker bar */
            height: 24px; 
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        /* Smooth expanding text logic */
        .text-wrapper {
            display: grid;
            grid-template-columns: 0fr;
            transition: grid-template-columns var(--trans-dur) var(--trans-ease);
            align-items: center;
        }

        .nav-item.active .text-wrapper {
            grid-template-columns: 1fr;
        }

        .nav-text {
            overflow: hidden;
            white-space: nowrap;
            font-weight: 600;
            font-size: 15px; 
            padding-left: 0;
            opacity: 0;
            /* Text fades in dynamically during the width transition */
            transition: padding-left var(--trans-dur) var(--trans-ease),
                        opacity calc(var(--trans-dur) * 0.8) ease;
        }

        .nav-item.active .nav-text {
            padding-left: 8px; /* Spacing between icon and text */
            opacity: 1;
            transition: padding-left var(--trans-dur) var(--trans-ease),
                        opacity var(--trans-dur) var(--trans-ease) 0.1s;
        }
    </style>
</head>
<body>

    <nav class="bottom-nav">
        <!-- The Gliding Background Element -->
        <div class="glider"></div>

        <!-- Home Tab -->
        <a href="#" class="nav-item active">
            <svg viewBox="0 0 24 24">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <div class="text-wrapper">
                <span class="nav-text">Home</span>
            </div>
        </a>

        <!-- Delivery Tab -->
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24">
                <rect x="1" y="3" width="15" height="13"></rect>
                <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
                <circle cx="5.5" cy="18.5" r="2.5"></circle>
                <circle cx="18.5" cy="18.5" r="2.5"></circle>
            </svg>
            <div class="text-wrapper">
                <span class="nav-text">Delivery</span>
            </div>
        </a>

        <!-- Shopping Bag Tab -->
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24">
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
            <div class="text-wrapper">
                <span class="nav-text">Cart</span>
            </div>
        </a>

        <!-- Magic/Stars Tab -->
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24">
                <path d="M12 2.5s1.5 5 5 6.5c-3.5 1.5-5 6.5-5 6.5s-1.5-5-5-6.5c3.5-1.5 5-6.5 5-6.5z"/>
                <path d="M19 12s1 2.5 3 3.5c-2 1-3 3.5-3 3.5s-1-2.5-3-3.5c2-1 3-3.5 3-3.5z"/>
                <path d="M6 15s.5 1.5 1.5 2c-1 .5-1.5 2-1.5 2s-.5-1.5-1.5-2c1-.5 1.5-2 1.5-2z"/>
            </svg>
            <div class="text-wrapper">
                <span class="nav-text">Stars</span>
            </div>
        </a>
    </nav>

    <script>
        const navContainer = document.querySelector('.bottom-nav');
        const navItems = document.querySelectorAll('.nav-item');
        const glider = document.querySelector('.glider');
        let prevActive = document.querySelector('.nav-item.active');

        // Initial setup for the glider position and size
        function updateGlider(activeElement) {
            glider.style.width = `${activeElement.offsetWidth}px`;
            glider.style.transform = `translateX(${activeElement.offsetLeft}px)`;
        }

        window.addEventListener('load', () => updateGlider(prevActive));
        window.addEventListener('resize', () => updateGlider(document.querySelector('.nav-item.active')));

        navItems.forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                if (this === prevActive) return; // Do nothing if already active

                /* 
                   FLAWLESS GLIDE MEASUREMENT LOGIC:
                   We disable animations temporarily, swap the classes so the browser calculates 
                   the EXACT mathematical end-state, measure it, swap back, and then animate to it.
                */

                // 1. Disable all transitions momentarily
                navContainer.classList.add('no-transition');

                // 2. Swap classes to preview the future
                prevActive.classList.remove('active');
                this.classList.add('active');

                // 3. Measure the exact future width and position of the new tab
                const targetWidth = this.offsetWidth;
                const targetLeft = this.offsetLeft;

                // 4. Revert back to the current state instantly
                this.classList.remove('active');
                prevActive.classList.add('active');

                // 5. Force a browser redraw so it registers the revert
                void navContainer.offsetHeight;

                // 6. Turn transitions back on
                navContainer.classList.remove('no-transition');

                // 7. Apply classes for the actual animation
                prevActive.classList.remove('active');
                this.classList.add('active');

                // 8. Command the glider to move using the perfect measurements
                glider.style.width = `${targetWidth}px`;
                glider.style.transform = `translateX(${targetLeft}px)`;

                // 9. Update the reference
                prevActive = this;
            });
        });
    </script>
</body>
</html>
