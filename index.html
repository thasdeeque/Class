<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bottom Navigation Bar</title>
  <style>
    /* Reset & Background */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #0f0f12;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .demo-content {
      text-align: center;
      padding: 20px;
      color: #71717a;
    }

    .demo-content h1 {
      color: #f4f4f5;
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    /* Floating Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 420px;
      height: 64px;
      background: rgba(18, 18, 22, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 32px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 10px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      z-index: 1000;
    }

    /* Nav Links */
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #8e8e93;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      flex: 1;
      height: 100%;
    }

    .nav-icon {
      width: 22px;
      height: 22px;
      transition: transform 0.2s ease, stroke 0.2s ease;
    }

    .nav-label {
      font-size: 11px;
      font-weight: 500;
      margin-top: 3px;
    }

    /* States */
    .nav-item:hover {
      color: #f3f4f6;
    }

    .nav-item.active {
      color: #3b82f6;
    }

    .nav-item.active .nav-icon {
      transform: translateY(-2px);
    }

    /* Center Action Button */
    .nav-item-primary {
      position: relative;
      top: -10px;
    }

    .primary-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .primary-btn .nav-icon {
      width: 24px;
      height: 24px;
      stroke: #ffffff;
    }

    .primary-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 25px rgba(59, 130, 246, 0.6);
    }
  </style>
</head>
<body>

  <div class="demo-content">
    <h1>App Content</h1>
    <p>Bottom navigation bar preview</p>
  </div>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <a href="#home" class="nav-item active">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span class="nav-label">Home</span>
    </a>

    <a href="#search" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span class="nav-label">Search</span>
    </a>

    <a href="#create" class="nav-item nav-item-primary">
      <div class="primary-btn">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </div>
    </a>

    <a href="#alerts" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span class="nav-label">Alerts</span>
    </a>

    <a href="#profile" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span class="nav-label">Profile</span>
    </a>
  </nav>

  <script>
    document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
      item.addEventListener('click', function(e) {
        if (this.classList.contains('nav-item-primary')) return;
        
        document.querySelectorAll('.bottom-nav .nav-item').forEach(nav => nav.classList.remove('active'));
        this.classList.add('active');
      });
    });
  </script>
</body>
</html>
