<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Bottom Navigation</title>
    <style>
        :root {
            --page-bg: #f2f2f7;
            --nav-bg: #1c1c1e;
            --active-bg: #f2f2f7;
            --active-color: #111111;
            --inactive-color: #6c6c70;
            /* Ultra-smooth easing curve inspired by native iOS/Wayland animations */
            --smooth-ease: cubic-bezier(0.25, 1, 0.4, 1);
        }

        body {
            background-color: var(--page-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Main Navigation Container */
        .bottom-nav {
            background-color: var(--nav-bg);
            display: flex;
            align-items: center;
            padding: 8px;
            border-radius: 999px;
            gap: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        /* Individual Navigation Items */
        .nav-item {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 56px;
            border-radius: 999px;
            cursor: pointer;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            position: relative;
            box-sizing: border-box;
            
            /* The core of the ultra-smooth expansion */
            transition: max-width 0.5s var(--smooth-ease),
                        background-color 0.4s var(--smooth-ease),
                        padding 0.5s var(--smooth-ease);
        }

        /* Active State Pill */
        .nav-item.active {
            max-width: 160px; /* Expands to fit text */
            background-color: var(--active-bg);
            padding: 0 28px 0 24px;
        }

        /* Inactive State Pill */
        .nav-item.inactive {
            max-width: 56px; /* Collapses to circle */
            width: 56px;
            background-color: transparent;
            padding: 0;
        }

        .nav-item.inactive:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* Icon Container */
        .icon-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 24px;
            height: 24px;
            z-index: 2;
        }

        .nav-icon {
            width: 24px;
            height: 24px;
            stroke-width: 2.2;
            transition: stroke 0.4s var(--smooth-ease);
        }

        .nav-item.active .nav-icon {
            stroke: var(--active-color);
        }

        .nav-item.inactive .nav-icon {
            stroke: var(--inactive-color);
        }

        /* Text Label */
        .nav-text {
            color: var(--active-color);
            font-size: 16.5px;
            font-weight: 600;
            margin-left: 10px;
            white-space: nowrap;
            overflow: hidden;
            
            /* Text fading and sliding out smoothly */
            opacity: 0;
            transform: translateX(-8px);
            transition: opacity 0.3s var(--smooth-ease),
                        transform 0.4s var(--smooth-ease),
                        margin 0.4s var(--smooth-ease),
                        max-width 0.4s var(--smooth-ease);
            max-width: 0;
        }

        .nav-item.active .nav-text {
            opacity: 1;
            transform: translateX(0);
            max-width: 100px; /* Reveals text space */
            transition-delay: 0.05s; /* Slight delay feels more organic */
        }

        .nav-item.inactive .nav-text {
            margin-left: 0;
        }
    </style>
</head>
<body>

    <nav class="bottom-nav">
        <!-- Home -->
        <a href="#" class="nav-item active" data-name="Home">
            <div class="icon-wrapper">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9.5L12 3l9 6.5V20a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-10.5z"></path>
                    <path d="M9 22V12h6v10"></path>
                </svg>
            </div>
            <span class="nav-text">Home</span>
        </a>

        <!-- Truck -->
        <a href="#" class="nav-item inactive" data-name="Deliveries">
            <div class="icon-wrapper">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="1" y="3" width="15" height="13" rx="1"></rect>
                    <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
                    <circle cx="5.5" cy="18.5" r="2.5"></circle>
                    <circle cx="18.5" cy="18.5" r="2.5"></circle>
                </svg>
            </div>
            <span class="nav-text">Deliveries</span>
        </a>

        <!-- Shopping Bag -->
        <a href="#" class="nav-item inactive" data-name="Shop">
            <div class="icon-wrapper">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <path d="M16 10a4 4 0 0 1-8 0"></path>
                </svg>
            </div>
            <span class="nav-text">Shop</span>
        </a>

        <!-- Sparkles / Magic -->
        <a href="#" class="nav-item inactive" data-name="Magic">
            <div class="icon-wrapper">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <!-- Custom curved 4-point star based on the reference -->
                    <path d="M12 3c0 4.5-1.5 6-6 6 4.5 0 6 1.5 6 6 0-4.5 1.5-6 6-6-4.5 0-6-1.5-6-6z"></path>
                    <path d="M19 4v4m-2-2h4"></path>
                    <circle cx="5" cy="18" r="1.5"></circle>
                </svg>
            </div>
            <span class="nav-text">Magic</span>
        </a>
    </nav>

    <script>
        // Logic to trigger the ultra-smooth active state transitions
        const navItems = document.querySelectorAll('.nav-item');

        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                
                // Reset all items to inactive
                navItems.forEach(nav => {
                    if (nav !== item) {
                        nav.classList.remove('active');
                        nav.classList.add('inactive');
                    }
                });
                
                // Set the clicked item to active
                item.classList.remove('inactive');
                item.classList.add('active');
            });
        });
    </script>
</body>
</html>
