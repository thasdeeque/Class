<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Bottom Navigation</title>
    <style>
        /* Base page styling */
        body {
            margin: 0;
            padding: 0;
            background-color: #F4F4F8; /* Light background matching the image */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        /* Outer pill container */
        .bottom-nav {
            position: fixed;
            bottom: 40px;
            display: flex;
            align-items: center;
            background-color: #1A1A1C; /* Dark charcoal */
            padding: 8px;
            border-radius: 50px;
            gap: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            /* Prevents highlight on mobile tap */
            -webkit-tap-highlight-color: transparent; 
        }

        /* Individual navigation items */
        .nav-item {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 16px;
            border-radius: 50px;
            text-decoration: none;
            color: #71717A; /* Muted gray for inactive icons */
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1), 
                        color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        /* SVG Icons */
        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        /* 
           CSS Grid animation trick for smooth width transitions.
           This keeps the outer container perfectly still while the inner items swap widths.
        */
        .text-wrapper {
            display: grid;
            grid-template-columns: 0fr;
            transition: grid-template-columns 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        margin-left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            margin-left: 0;
            align-items: center;
        }

        .nav-text {
            overflow: hidden;
            white-space: nowrap;
            font-weight: 600;
            font-size: 15px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* Active State Styles */
        .nav-item.active {
            background-color: #F4F4F8; /* Light pill background */
            color: #1A1A1C; /* Dark text and icon */
        }

        .nav-item.active .text-wrapper {
            grid-template-columns: 1fr;
            margin-left: 8px; /* Spacing between icon and text */
        }

        .nav-item.active .nav-text {
            opacity: 1;
            /* Slight delay so text fades in after width expands */
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1) 0.1s; 
        }
    </style>
</head>
<body>

    <nav class="bottom-nav">
        <!-- Home Tab (Active by default) -->
        <a href="#" class="nav-item active">
            <svg viewBox="0 0 24 24">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <div class="text-wrapper">
                <span class="nav-text">Home</span>
            </div>
        </a>

        <!-- Delivery Tab -->
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24">
                <rect x="1" y="3" width="15" height="13"></rect>
                <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
                <circle cx="5.5" cy="18.5" r="2.5"></circle>
                <circle cx="18.5" cy="18.5" r="2.5"></circle>
            </svg>
            <div class="text-wrapper">
                <span class="nav-text">Delivery</span>
            </div>
        </a>

        <!-- Shopping Bag Tab -->
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24">
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
            <div class="text-wrapper">
                <span class="nav-text">Cart</span>
            </div>
        </a>

        <!-- Magic/Stars Tab -->
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24">
                <path d="M12 2.5s1.5 5 5 6.5c-3.5 1.5-5 6.5-5 6.5s-1.5-5-5-6.5c3.5-1.5 5-6.5 5-6.5z"/>
                <path d="M19 12s1 2.5 3 3.5c-2 1-3 3.5-3 3.5s-1-2.5-3-3.5c2-1 3-3.5 3-3.5z"/>
                <path d="M6 15s.5 1.5 1.5 2c-1 .5-1.5 2-1.5 2s-.5-1.5-1.5-2c1-.5 1.5-2 1.5-2z"/>
            </svg>
            <div class="text-wrapper">
                <span class="nav-text">Stars</span>
            </div>
        </a>
    </nav>

    <script>
        // Select all navigation items
        const navItems = document.querySelectorAll('.nav-item');

        navItems.forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault(); // Prevent default link jumping
                
                // Remove the 'active' class from all items
                navItems.forEach(nav => nav.classList.remove('active'));
                
                // Add the 'active' class to the clicked item
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>
