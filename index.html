<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Classroom — Home</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0a0a">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">

  <!-- ============ HERO / TOPBAR ============ -->
  <div class="hero">
    <div class="hero-top">
      <button class="icon-btn" id="settingsBtn" aria-label="Teacher settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <div class="hero-actions">
        <button class="icon-btn" aria-label="Notifications">
          <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="badge">3</span>
        </button>
      </div>
    </div>

    <h1 class="hero-title" id="heroTitle">Students</h1>
    <p class="hero-sub" id="heroSub">Tap your profile to log in</p>

    <div class="chip-row" id="tabChips">
      <button class="chip active" data-tab="students">Students</button>
      <button class="chip" data-tab="books">Books to Bring</button>
      <button class="chip" data-tab="cleaning">Cleaning Duty</button>
      <button class="chip" data-tab="announcements">Announcements</button>
    </div>
  </div>

  <!-- ============ SCREENS ============ -->
  <div class="screen">

    <!-- STUDENTS -->
    <section id="tab-students">
      <div class="student-grid" id="studentGrid"></div>
    </section>

    <!-- BOOKS TO BRING -->
    <section id="tab-books" class="hidden">
      <div class="placeholder-wrap">
        <img class="placeholder-img" id="booksImg" alt="Weekly books roster">
        <p class="placeholder-caption">Weekly roster — updated every Monday morning</p>
      </div>
    </section>

    <!-- CLEANING DUTY -->
    <section id="tab-cleaning" class="hidden">
      <div class="placeholder-wrap">
        <img class="placeholder-img" id="cleaningImg" alt="Weekly cleaning schedule">
        <p class="placeholder-caption">Cleaning schedule — rotates weekly by row</p>
      </div>
    </section>

    <!-- ANNOUNCEMENTS -->
    <section id="tab-announcements" class="hidden">
      <div class="announce-list" id="announceList"></div>
    </section>

  </div>

  <!-- ============ BOTTOM NAV ============ -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="students">
      <span class="nav-pill"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
      <span>Students</span>
    </button>
    <button class="nav-item" data-tab="books">
      <span class="nav-pill"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
      <span>Books</span>
    </button>
    <button class="nav-item" data-tab="cleaning">
      <span class="nav-pill"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 3.5 20.5 8.5"/><path d="m3 21 3.5-1 8.5-8.5-2.5-2.5L4 17.5Z"/><path d="M13.5 5.5 18 10"/></svg></span>
      <span>Cleaning</span>
    </button>
    <button class="nav-item" data-tab="announcements">
      <span class="nav-pill"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg></span>
      <span>News</span>
    </button>
  </nav>

  <!-- ============ STUDENT LOGIN MODAL ============ -->
  <div class="modal-overlay center" id="studentLoginModal">
    <div class="sheet" style="position:relative;">
      <button class="btn-close-x" data-close="studentLoginModal">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div style="text-align:center; margin-top:6px;">
        <div class="student-avatar" style="width:64px;height:64px;margin:0 auto 14px;" id="loginModalAvatarWrap">
          <img id="loginModalAvatar" src="" alt="">
        </div>
      </div>
      <h2 class="sheet-title" style="text-align:center;" id="loginModalName">Student Login</h2>
      <p class="sheet-sub" style="text-align:center;">Enter your details to continue</p>
      <form id="studentLoginForm">
        <div class="field">
          <label>Username</label>
          <input type="text" placeholder="e.g. amara.p" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary">Log In</button>
      </form>
    </div>
  </div>

  <!-- ============ TEACHER LOGIN MODAL ============ -->
  <div class="modal-overlay center" id="teacherLoginModal">
    <div class="sheet" style="position:relative;">
      <button class="btn-close-x" data-close="teacherLoginModal">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div style="text-align:center;">
        <div class="login-mark" style="margin:0 auto 14px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
      </div>
      <h2 class="sheet-title" style="text-align:center;">Teacher Login</h2>
      <p class="sheet-sub" style="text-align:center;">Staff access only</p>
      <form id="teacherLoginForm">
        <div class="field">
          <label>Username</label>
          <input type="text" placeholder="teacher.id" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary">Log In</button>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

</div>

<script src="js/index.js"></script>
</body>
</html>
