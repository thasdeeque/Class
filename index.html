<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Gliding Navigation</title>
    <style>
        :root {
            /* Snappier, faster animation duration */
            --trans-dur: 0.38s; 
            /* Bouncy spring-like easing for middle items */
            --trans-ease-bounce: cubic-bezier(0.34, 1.3, 0.64, 1);
            /* Clean smooth easing for the first and last items to prevent boundary overflow */
            --trans-ease-smooth: cubic-bezier(0.25, 1, 0.5, 1);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #F4F4F8; /* Light background */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        /* Outer pill container */
        .bottom-nav {
            position: fixed;
            bottom: 16px; 
            display: flex;
            align-items: center;
            background-color: #1A1A1C;
            
            width: 358px; 
            height: 72px; 
            box-sizing: border-box;
            
            padding: 6px;
            gap: 8px; 
            border-radius: 40px; 
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.15);
            -webkit-tap-highlight-color: transparent; 
        }

        /* Utility class used by JS to measure without triggering animations */
        .bottom-nav.no-transition * {
            transition: none !important;
        }

        /* The white gliding background */
        .glider {
            position: absolute;
            top: 6px;
            left: 0;
            height: 60px; 
            background-color: #F4F4F8;
            border-radius: 30px;
            z-index: 0;
            transition: transform var(--trans-dur) var(--trans-ease-bounce), 
                        width var(--trans-dur) var(--trans-ease-bounce);
        }

        /* Individual navigation items */
        .nav-item {
            position: relative;
            z-index: 1; 
            display: flex;
            align-items: center;
            justify-content: center;
            height: 60px; 
            border-radius: 30px;
            text-decoration: none;
            color: #71717A; 
            cursor: pointer;
            
            width: 60px; 
            flex-shrink: 0;
            
            transition: width var(--trans-dur) var(--trans-ease-bounce),
                        color var(--trans-dur) var(--trans-ease-bounce);
        }

        .nav-item.active {
            width: 142px; 
            color: #1A1A1C;
        }

        /* SVG Icons */
        .nav-item svg {
            width: 24px; 
            height: 24px; 
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        /* Smooth expanding text logic */
        .text-wrapper {
            display: grid;
            grid-template-columns: 0fr;
            transition: grid-template-columns var(--trans-dur) var(--trans-ease-bounce);
            align-items: center;
        }

        .nav-item.active .text-wrapper {
            grid-template-columns: 1fr;
        }

        .nav-text {
            overflow: hidden;
            white-space: nowrap;
            font-weight: 600;
            font-size: 15px; 
            padding-left: 0;
            opacity: 0;
            transition: padding-left var(--trans-dur) var(--trans-ease-bounce),
                        opacity calc(var(--trans-dur) * 0.8) ease;
        }

        .nav-item.active .nav-text {
            padding-left: 8px; 
            opacity: 1;
            transition: padding-left var(--trans-dur) var(--trans-ease-bounce),
                        opacity var(--trans-dur) var(--trans-ease-bounce) 0.1s;
        }
    </style>
</head>
<body>

    <nav class="bottom-nav">
        <!-- The Gliding Background Element -->
        <div class="glider"></div>

        <!-- Home Tab (Index 0) -->
        <a href="#" class="nav-item active">
            <svg viewBox="0 0 24 24">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <div class="text-wrapper">
                <span class="nav-text">Home</span>
            </div>
        </a>

        <!-- Delivery Tab (Index 1) -->
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24">
                <rect x="1" y="3" width="15" height="13"></rect>
                <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
                <circle cx="5.5" cy="18.5" r="2.5"></circle>
                <circle cx="18.5" cy="18.5" r="2.5"></circle>
            </svg>
            <div class="text-wrapper">
                <span class="nav-text">Delivery</span>
            </div>
        </a>

        <!-- Shopping Bag Tab (Index 2) -->
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24">
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
            <div class="text-wrapper">
                <span class="nav-text">Cart</span>
            </div>
        </a>

        <!-- Magic/Stars Tab (Index 3) -->
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24">
                <path d="M12 2.5s1.5 5 5 6.5c-3.5 1.5-5 6.5-5 6.5s-1.5-5-5-6.5c3.5-1.5 5-6.5 5-6.5z"/>
                <path d="M19 12s1 2.5 3 3.5c-2 1-3 3.5-3 3.5s-1-2.5-3-3.5c2-1 3-3.5 3-3.5z"/>
                <path d="M6 15s.5 1.5 1.5 2c-1 .5-1.5 2-1.5 2s-.5-1.5-1.5-2c1-.5 1.5-2 1.5-2z"/>
            </svg>
            <div class="text-wrapper">
                <span class="nav-text">Stars</span>
            </div>
        </a>
    </nav>

    <script>
        const navContainer = document.querySelector('.bottom-nav');
        const navItems = Array.from(document.querySelectorAll('.nav-item'));
        const glider = document.querySelector('.glider');
        let prevActive = document.querySelector('.nav-item.active');

        function updateGlider(activeElement) {
            glider.style.width = `${activeElement.offsetWidth}px`;
            glider.style.transform = `translateX(${activeElement.offsetLeft}px)`;
        }

        window.addEventListener('load', () => updateGlider(prevActive));
        window.addEventListener('resize', () => updateGlider(document.querySelector('.nav-item.active')));

        navItems.forEach((item, index) => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                if (this === prevActive) return;

                // Use smooth non-bouncing easing if moving to/from the first (0) or last (navItems.length - 1) item
                const targetIndex = navItems.indexOf(this);
                const prevIndex = navItems.indexOf(prevActive);
                const isEdgeTransition = (targetIndex === 0 || targetIndex === navItems.length - 1 || prevIndex === 0 || prevIndex === navItems.length - 1);

                const chosenEasing = isEdgeTransition ? 'var(--trans-ease-smooth)' : 'var(--trans-ease-bounce)';
                
                glider.style.transitionTimingFunction = chosenEasing;
                navItems.forEach(n => {
                    n.style.transitionTimingFunction = chosenEasing;
                    const textWrap = n.querySelector('.text-wrapper');
                    if (textWrap) textWrap.style.transitionTimingFunction = chosenEasing;
                });

                // 1. Disable transitions momentarily for measurement
                navContainer.classList.add('no-transition');

                // 2. Preview future state
                prevActive.classList.remove('active');
                this.classList.add('active');

                // 3. Measure future specs
                const targetWidth = this.offsetWidth;
                const targetLeft = this.offsetLeft;

                // 4. Revert state
                this.classList.remove('active');
                prevActive.classList.add('active');

                // 5. Reflow
                void navContainer.offsetHeight;

                // 6. Re-enable transitions
                navContainer.classList.remove('no-transition');

                // 7. Apply active state for animation
                prevActive.classList.remove('active');
                this.classList.add('active');

                // 8. Move glider
                glider.style.width = `${targetWidth}px`;
                glider.style.transform = `translateX(${targetLeft}px)`;

                prevActive = this;
            });
        });
    </script>
</body>
</html>
